{{define "content"}}

<div class="auth-page">
  <div class="auth-card register-card">
    <div class="auth-header">
      <h1>Create your account</h1>
      <p>Join the JobFlow professional community.</p>
    </div>

    <form action="/register" method="POST" id="register-form">
      <div class="form-row">
        <div class="form-group">
          <label for="first_name">First name</label>

          <input
            type="text"
            id="first_name"
            name="first_name"
            placeholder="First name"
            required
          />
        </div>

        <div class="form-group">
          <label for="last_name">Last name</label>

          <input
            type="text"
            id="last_name"
            name="last_name"
            placeholder="Last name"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username</label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Choose a username"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-field">
          <input type="password" id="password" name="password" placeholder="Create a password"
            required minlength="12" maxlength="128" autocomplete="new-password"
            aria-describedby="password-help password-strength" />
          <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <p id="password-help" class="password-help">Use at least 12 characters. Longer, unique passwords or passphrases are best.</p>
        <div class="strength-track" aria-hidden="true"><div id="strength-fill"></div></div>
        <p id="password-strength" class="password-help" aria-live="polite">Password strength: Not entered</p>
        <button type="button" id="generate-password" class="secondary-button">Generate strong password</button>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm password</label>
        <div class="password-field">
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password"
            required autocomplete="new-password" />
          <button type="button" class="password-toggle" data-toggle-password="confirm_password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <p id="password-match" class="password-help password-match-message" role="status" aria-live="polite"></p>
      </div>

      <div class="form-group">
        <label for="date_of_birth">Date of birth</label>

        <input type="date" id="date_of_birth" name="date_of_birth" required />
      </div>

      <div class="form-group">
        <label for="role">Account type</label>

        <select id="role" name="role" required>
          <option value="">Select account type</option>
          <option value="individual">Individual</option>
          <option value="company">Company</option>
        </select>
      </div>

      <div id="company-fields" class="company-section">
        <h2>Company information</h2>

        <p class="section-description">Tell us a little about your company.</p>

        <div class="form-group">
          <label for="company_name">Company name</label>

          <input
            type="text"
            id="company_name"
            name="company_name"
            placeholder="Company name"
          />
        </div>

        <div class="form-group">
          <label for="industry">Industry</label>

          <input
            type="text"
            id="industry"
            name="industry"
            placeholder="e.g. Technology"
          />
        </div>

        <div class="form-group">
          <label for="company_size">Company size</label>

          <select id="company_size" name="company_size">
            <option value="">Select company size</option>
            <option value="1-10">1-10 employees</option>
            <option value="11-50">11-50 employees</option>
            <option value="51-200">51-200 employees</option>
            <option value="201-500">201-500 employees</option>
            <option value="501-1000">501-1000 employees</option>
            <option value="1000+">1000+ employees</option>
          </select>
        </div>

        <div class="form-group">
          <label for="location">Location</label>

          <input
            type="text"
            id="location"
            name="location"
            placeholder="Company location"
          />
        </div>

        <div class="form-group">
          <label for="website">Website</label>

          <input
            type="url"
            id="website"
            name="website"
            placeholder="https://example.com"
          />
        </div>

        <div class="form-group">
          <label for="description">Company description</label>

          <textarea
            id="description"
            name="description"
            placeholder="Tell people about your company..."
            rows="4"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="logo">Logo URL</label>

          <input
            type="url"
            id="logo"
            name="logo"
            placeholder="https://example.com/logo.png"
          />
        </div>
      </div>

      <button type="submit" class="submit-button">Create Account</button>
    </form>

    <div class="auth-footer">
      <p>
        Already have an account?
        <a href="/login">Sign in</a>
      </p>
    </div>
  </div>
</div>

<script>
  const roleSelect = document.getElementById("role");
  const companyFields = document.getElementById("company-fields");

  function updateCompanyFields() {
    if (roleSelect.value === "company") {
      companyFields.style.display = "block";
    } else {
      companyFields.style.display = "none";
    }
  }

  roleSelect.addEventListener("change", updateCompanyFields);

  updateCompanyFields();

  document.querySelectorAll('[data-toggle-password]').forEach(button => {
    button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.togglePassword);
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      button.textContent = visible ? 'Hide' : 'Show';
      button.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
      button.setAttribute('aria-pressed', String(visible));
    });
  });

  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirm_password');
  const strengthText = document.getElementById('password-strength');
  const strengthFill = document.getElementById('strength-fill');
  const matchText = document.getElementById('password-match');

  function updatePasswordFeedback() {
    const value = passwordInput.value;
    const lower = value.toLowerCase();
    const common = /password|123456|qwerty|letmein|admin|welcome|iloveyou|abcdef/i.test(value);
    const repeated = /(.)\1{3,}/.test(value);
    let score = 0;
    if (value.length >= 12) score++;
    if (value.length >= 16) score++;
    if (value.length >= 20) score++;
    if (/[a-z]/.test(value) && /[A-Z]/.test(value)) score++;
    if (/\d/.test(value) && /[^a-zA-Z0-9]/.test(value)) score++;
    if (common || repeated || lower.includes(document.getElementById('username').value.toLowerCase()) && document.getElementById('username').value.length > 2) score = Math.min(score, 1);
    const labels = ['Very weak', 'Weak', 'Fair', 'Good', 'Strong', 'Very strong'];
    const colors = ['#dc2626', '#ea580c', '#d97706', '#ca8a04', '#16a34a', '#15803d'];
    strengthText.textContent = 'Password strength: ' + (value ? labels[score] : 'Not entered');
    strengthFill.style.width = value ? ((score + 1) / 6 * 100) + '%' : '0';
    strengthFill.style.background = colors[score];
    // This is only a visual guide; the Go backend must validate passwords independently.
    const hasConfirmation = confirmInput.value.length > 0;
    const matches = confirmInput.value === value;
    confirmInput.setCustomValidity(hasConfirmation && !matches ? 'Passwords do not match.' : '');
    confirmInput.classList.toggle('input-error', hasConfirmation && !matches);
    confirmInput.classList.toggle('input-success', hasConfirmation && matches);
    matchText.classList.toggle('is-error', hasConfirmation && !matches);
    matchText.classList.toggle('is-success', hasConfirmation && matches);
    matchText.textContent = hasConfirmation ? (matches ? 'Passwords match.' : 'Passwords do not match.') : '';
  }
  passwordInput.addEventListener('input', updatePasswordFeedback);
  confirmInput.addEventListener('input', updatePasswordFeedback);
  document.getElementById('username').addEventListener('input', updatePasswordFeedback);

  document.getElementById('generate-password').addEventListener('click', () => {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?';
    const bytes = new Uint32Array(24);
    const max = Math.floor(0x100000000 / chars.length) * chars.length;
    let result = '';
    while (result.length < 24) {
      crypto.getRandomValues(bytes);
      for (const value of bytes) {
        if (value < max) result += chars[value % chars.length];
        if (result.length === 24) break;
      }
    }
    passwordInput.value = result;
    confirmInput.value = result;
    updatePasswordFeedback();
  });

  document.getElementById('register-form').addEventListener('submit', event => {
    updatePasswordFeedback();
    if (!confirmInput.value || passwordInput.value !== confirmInput.value) {
      event.preventDefault();
      if (!confirmInput.value) matchText.textContent = 'Please confirm your password.';
      matchText.classList.add('is-error');
      confirmInput.classList.add('input-error');
      confirmInput.focus();
    }
  });
</script>

<style>
  .auth-page {
    display: flex;
    justify-content: center;
    padding: 30px 0;
  }

  .auth-card {
    width: min(550px, 100%);
    background: #ffffff;
    padding: 35px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
  }

  .auth-header {
    text-align: center;
    margin-bottom: 30px;
  }

  .auth-header h1 {
    margin-bottom: 8px;
    font-size: 28px;
  }

  .auth-header p {
    color: #6b7280;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    font-family: inherit;
    font-size: 15px;
  }

  .form-group textarea {
    resize: vertical;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #2563eb;
  }

  .company-section {
    display: none;
    margin: 25px 0;
    padding: 20px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
  }

  .company-section h2 {
    margin-bottom: 5px;
    font-size: 20px;
  }

  .section-description {
    color: #6b7280;
    margin-bottom: 20px;
    font-size: 14px;
  }

  .submit-button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .submit-button:hover {
    background: #1d4ed8;
  }

  .auth-footer {
    text-align: center;
    margin-top: 25px;
    color: #6b7280;
  }

  .auth-footer a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
  }

  @media (max-width: 600px) {
    .form-row {
      grid-template-columns: 1fr;
      gap: 0;
    }

    .auth-card {
      padding: 25px;
    }
  }

  .password-match-message { min-height: 18px; }
  .password-match-message.is-error { color: #dc2626; }
  .password-match-message.is-success { color: #15803d; }
  .password-field input.input-error { border-color: #dc2626; }
  .password-field input.input-success { border-color: #16a34a; }
  .password-field { position: relative; }
  .password-field input { box-sizing: border-box; padding-right: 76px; }
  .password-toggle { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: #2563eb; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 7px; }
  .password-help { color: #6b7280; font-size: 12px; margin: 7px 0; line-height: 1.5; }
  .strength-track { height: 6px; background: #e5e7eb; border-radius: 8px; overflow: hidden; margin-top: 10px; }
  #strength-fill { height: 100%; width: 0; transition: width .2s ease; }
  .secondary-button { margin-top: 8px; padding: 9px 12px; border: 1px solid #2563eb; background: #eff6ff; color: #1d4ed8; border-radius: 7px; font-weight: 600; cursor: pointer; }
</style>

{{end}}
