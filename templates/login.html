{{define "content"}}

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome back</h1>
      <p>Sign in to continue to JobFlow.</p>
    </div>

    <form action="/login" method="POST">
      <div class="form-group">
        <label for="username">Username</label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="submit-button">Sign In</button>
    </form>

    <div class="auth-footer">
      <p>
        Don't have an account?
        <a href="/register">Create one</a>
      </p>
    </div>
  </div>
</div>

<style>
  .auth-page {
    min-height: 75vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .auth-card {
    width: min(450px, 100%);
    background: #ffffff;
    padding: 35px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
  }

  .auth-header {
    text-align: center;
    margin-bottom: 30px;
  }

  .auth-header h1 {
    margin-bottom: 8px;
    font-size: 28px;
  }

  .auth-header p {
    color: #6b7280;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
  }

  .form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    font-size: 15px;
  }

  .form-group input:focus {
    outline: none;
    border-color: #2563eb;
  }

  .submit-button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .submit-button:hover {
    background: #1d4ed8;
  }

  .auth-footer {
    text-align: center;
    margin-top: 25px;
    color: #6b7280;
  }

  .auth-footer a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
  }
</style>

{{end}}
