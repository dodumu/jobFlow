{{define "title"}}{{.Title}} | JobFlow{{end}}

{{define "content"}}

<style>
    .error-page {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
    }

    .error-container {
        max-width: 600px;
        width: 100%;
        text-align: center;
    }

    .error-code {
        font-size: 5rem;
        font-weight: 700;
        margin: 0;
        line-height: 1;
    }

    .error-container h1 {
        margin: 1rem 0;
        font-size: 2rem;
    }

    .error-message {
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
    }

    .error-home-btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
    }
</style>

<section class="error-page">
    <div class="error-container">

        <p class="error-code">{{.StatusCode}}</p>

        <h1>{{.Title}}</h1>

        <p class="error-message">
            {{.Message}}
        </p>

        <a href="/home" class="error-home-btn">
            Back to Home
        </a>

    </div>
</section>

{{end}}
