{{define "base"}}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>JobFlow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;

      --background: #f3f6f9;
      --surface: #ffffff;

      --border: #e5e7eb;

      --text: #111827;
      --muted: #6b7280;

      --soft: #f8fafc;

      --danger: #dc2626;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;

      background: var(--background);
      color: var(--text);

      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    /* =========================
         NAVBAR
         ========================= */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 64px;

      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .navbar-inner {
      width: min(1200px, 94%);
      height: 100%;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      text-decoration: none;

      font-size: 23px;
      font-weight: 800;

      letter-spacing: -0.5px;

      color: var(--primary);
    }

    .nav-links {
      display: flex;
      align-items: center;

      gap: 8px;
    }

    .nav-link {
      text-decoration: none;

      color: var(--muted);

      font-size: 14px;
      font-weight: 600;

      padding: 9px 14px;

      border-radius: 8px;

      transition: 0.2s ease;
    }

    .nav-link:hover {
      color: var(--primary);
      background: #eff6ff;
    }

    .nav-link.active {
      color: var(--primary);
      background: #eff6ff;
    }

    /* =========================
         MAIN CONTAINER
         ========================= */

    .container {
      width: min(1200px, 94%);

      margin: 0 auto;

      padding: 30px 0 50px;
    }

    /* =========================
         BUTTONS
         ========================= */

    .btn-primary {
      background: var(--primary);
      color: white;

      padding: 10px 18px;

      border-radius: 8px;

      font-weight: 600;

      transition: 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: white;
      color: var(--text);

      border: 1px solid var(--border);

      padding: 9px 16px;

      border-radius: 8px;

      font-weight: 600;

      transition: 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--soft);
    }
    .menu-toggle {
      display: none;
      background: transparent;
      color: var(--text);
      font-size: 26px;
      padding: 6px 10px;
    }

    .public-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* =========================
         RESPONSIVE
         ========================= */

    @media (max-width: 768px) {
      .navbar {
        height: auto;
        min-height: 64px;
      }

      .navbar-inner {
        width: 92%;
        min-height: 64px;
        position: relative;
      }

      .container {
        width: 92%;
        padding: 20px 0 40px;
      }

      .menu-toggle {
        display: block;
      }

      .nav-links {
        display: none;

        position: absolute;
        top: 64px;
        left: 0;
        right: 0;

        flex-direction: column;
        align-items: stretch;

        padding: 12px;

        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0 0 10px 10px;

        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      .nav-links.open {
        display: flex;
      }

      .nav-link {
        width: 100%;
        padding: 12px;
      }

      .nav-links form {
        width: 100%;
      }

      .logout-button {
        text-align: left;
      }

      .public-nav {
        display: flex;
      }

      .public-nav .nav-link {
        width: auto;
        padding: 8px 9px;
      }
    }

    .logout-button {
      background: transparent;
      font-family: inherit;
      cursor: pointer;
    }

    .logout-button:hover {
      color: var(--danger);
      background: #fef2f2;
    }

    
  </style>
</head>
<script>
  const menuToggle = document.querySelector(".menu-toggle");
  const navLinks = document.querySelector(".nav-links");

  if (menuToggle && navLinks) {
    menuToggle.addEventListener("click", function () {
      const isOpen = navLinks.classList.toggle("open");

      menuToggle.setAttribute("aria-expanded", isOpen);
      menuToggle.textContent = isOpen ? "✕" : "☰";
    });
  }
</script>

<body>
  <nav class="navbar">
    <div class="navbar-inner">

      {{if isAuthenticated}}

      <a href="/dashboard" class="brand">JobFlow</a>
      <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">
        ☰
      </button>
      <div class="nav-links">
        <a href="/home" class="nav-link">Home</a>
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/profile" class="nav-link">Profile</a>
        <a href="/jobs" class="nav-link">Jobs</a>
        <a href="/applications" class="nav-link">Applications</a>

        <form action="/logout" method="POST">
          <button type="submit" class="nav-link logout-button">
            Logout
          </button>
        </form>
      </div>

      {{else}}

      <a href="/" class="brand">JobFlow</a>

      <div class="nav-links">
        <a href="/login" class="nav-link">Login</a>
        <a href="/register" class="nav-link">Register</a>
      </div>

      {{end}}

    </div>
  </nav>

  <main class="container">{{template "content" .}}</main>
</body>

</html>
{{end}}
