
{{define "content"}}
<section class="reset-password-wrapper">
    <div class="reset-password-card">
        <h1>Set a new password</h1>
        <p>Choose a new password for your JobFlow account.</p>

        {{if .Error}}
            <p class="reset-password-error">{{.Error}}</p>
        {{end}}

        <form action="/reset-password" method="POST">
            <input
                type="hidden"
                name="token"
                value="{{.Token}}"
            >

            <label for="password">New password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="12"
                maxlength="128"
                aria-describedby="password-hint"
                required
            >
            <p id="password-hint" class="reset-password-hint">
                Use at least 12 characters. A longer passphrase is best.
            </p>

            <label for="confirm_password">Confirm new password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                autocomplete="new-password"
                minlength="12"
                maxlength="128"
                aria-describedby="match-message"
                required
            >
            <p id="match-message" class="reset-password-hint" role="status" aria-live="polite"></p>

            <button type="submit">Reset password</button>
        </form>

        <script>
            (function () {
                var pw = document.getElementById('password');
                var confirmPw = document.getElementById('confirm_password');
                var msg = document.getElementById('match-message');

                function check() {
                    if (!confirmPw.value) {
                        confirmPw.setCustomValidity('');
                        msg.textContent = '';
                        msg.className = 'reset-password-hint';
                        return;
                    }
                    var ok = pw.value === confirmPw.value;
                    confirmPw.setCustomValidity(ok ? '' : 'Passwords do not match.');
                    msg.textContent = ok ? 'Passwords match.' : 'Passwords do not match.';
                    msg.className = 'reset-password-hint ' + (ok ? 'is-success' : 'is-error');
                }

                pw.addEventListener('input', check);
                confirmPw.addEventListener('input', check);
            })();
        </script>

        <a href="/login">Back to login</a>
    </div>
</section>

<style>
.reset-password-wrapper {
    max-width: 460px;
    margin: 50px auto;
    padding: 20px;
}

.reset-password-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px;
}

.reset-password-card h1 {
    color: var(--text);
    margin-bottom: 10px;
}

.reset-password-card p {
    color: var(--muted);
}

.reset-password-card form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 24px;
}

.reset-password-card label {
    color: var(--text);
    font-weight: 600;
}

.reset-password-card input {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    box-sizing: border-box;
}

.reset-password-card button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.reset-password-card button:hover {
    background: var(--primary-dark);
}

.reset-password-card a {
    display: inline-block;
    margin-top: 20px;
    color: var(--primary);
}

.reset-password-hint {
    margin: -4px 0 4px;
    font-size: 12px;
    line-height: 1.5;
    min-height: 18px;
}

.reset-password-hint.is-error { color: #dc2626; }
.reset-password-hint.is-success { color: #15803d; }

.reset-password-card button:focus-visible,
.reset-password-card input:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

.reset-password-error {
    padding: 10px;
    border-radius: 8px;
    color: #b91c1c !important;
    background: #fee2e2;
}
</style>
{{end}}
