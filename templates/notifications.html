 {{define "content"}}
<style>
    .notifications-page {
        max-width: 850px;
        margin: 32px auto;
        padding: 0 20px;
    }

    .notifications-header {
        margin-bottom: 24px;
    }

    .notifications-header h1 {
        margin: 0 0 8px;
        color: #1e293b;
        font-size: 28px;
    }

    .notifications-header p {
        margin: 0;
        color: #64748b;
    }

    .notifications-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .notification-form {
        width: 100%;
        margin: 0;
    }

    .notification-item {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        width: 100%;
        padding: 18px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        font-family: inherit;
        font-size: inherit;
        text-align: left;
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
    }

    .notification-item.unread {
        background: #eff6ff;
        border-color: #bfdbfe;
    }

    .notification-item:hover {
        border-color: #93c5fd;
    }

    .notification-item:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 3px;
    }

    .notification-indicator {
        width: 10px;
        flex-shrink: 0;
        padding-top: 6px;
    }

    .unread-dot {
        display: block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #2563eb;
    }

    .notification-content {
        display: block;
        flex: 1;
        min-width: 0;
    }

    .notification-message {
        display: block;
        margin: 0 0 8px;
        color: #1e293b;
        line-height: 1.5;
        overflow-wrap: anywhere;
    }

    .notification-time {
        display: block;
        color: #64748b;
        font-size: 13px;
    }

    .notification-link {
        flex-shrink: 0;
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
    }

    .notification-item:hover .notification-link {
        color: #1d4ed8;
        text-decoration: underline;
    }

    .notifications-empty {
        padding: 48px 20px;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
    }

    .empty-icon {
        margin-bottom: 12px;
        color: #2563eb;
        font-size: 32px;
    }

    .notifications-empty h2 {
        margin: 0 0 8px;
        color: #1e293b;
        font-size: 20px;
    }

    .notifications-empty p {
        margin: 0;
        color: #64748b;
        line-height: 1.5;
    }

    @media (max-width: 600px) {
        .notifications-page {
            margin-top: 20px;
            padding: 0 12px;
        }

        .notification-item {
            gap: 10px;
            padding: 14px 12px;
        }

        .notifications-header h1 {
            font-size: 24px;
        }
    }
</style>

<div class="notifications-page">
    <div class="notifications-header">
        <h1>Notifications</h1>
        <p>Stay updated on what's happening with your JobFlow account.</p>
    </div>

    {{if .Notification}}
    <div class="notifications-list">
        {{range .Notification}}
        <form action="/notifications/read" method="POST" class="notification-form">
            <input type="hidden" name="notification_id" value="{{.ID}}">

            <button type="submit"
                class="notification-item {{if not .IsRead}}unread{{end}}">

                <span class="notification-indicator">
                    {{if not .IsRead}}
                    <span class="unread-dot"></span>
                    {{end}}
                </span>

                <span class="notification-content">
                    <span class="notification-message">{{.Message}}</span>
                    <span class="notification-time">{{.CreatedAt}}</span>
                </span>

                {{if .Link.Valid}}
                <span class="notification-link">View</span>
                {{else}}
                <span class="notification-link">View notifications</span>
                {{end}}
            </button>
        </form>
        {{end}}
    </div>
    {{else}}
    <div class="notifications-empty">
        <div class="empty-icon">♧</div>
        <h2>You're all caught up!</h2>
        <p>When something happens on JobFlow, your notifications will appear here.</p>
    </div>
    {{end}}
</div>
{{end}}
